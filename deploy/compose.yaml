# Run from deploy/:  docker compose up -d
# Needs deploy/.env (VAULTAGE_DOMAIN=...) and deploy/secrets/enroll_token.
name: coffer   # kept from before the rename: the data volume is named after it

services:
  vaultaged:
    image: vaultaged:${VAULTAGE_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      VAULTAGE_ENROLL_TOKEN_FILE: /run/secrets/enroll_token
    secrets:
      - enroll_token
    volumes:
      - coffer-data:/data
    expose:
      - "8787"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 20m

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    depends_on:
      - vaultaged
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VAULTAGE_DOMAIN: ${VAULTAGE_DOMAIN:?set VAULTAGE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 20m

secrets:
  enroll_token:
    file: ./secrets/enroll_token

volumes:
  coffer-data:
  caddy-data:
  caddy-config:
